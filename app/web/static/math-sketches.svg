<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 240" fill="none" stroke="#d0b279" stroke-width="1.1" stroke-linecap="round" stroke-linejoin="round">
  <style>
    path:not([stroke-dasharray]), circle:not([fill]) {
      stroke-dasharray: 1000; stroke-dashoffset: 1000;
      animation: draw-study 22s ease-in-out infinite;
    }
    g:nth-of-type(2) path, g:nth-of-type(2) circle { animation-delay: -15s; }
    g:nth-of-type(3) path { animation-delay: -9s; }
    text { animation: reveal-note 22s ease-in-out infinite; }
    @keyframes draw-study {
      0% { stroke-dashoffset: 1000; opacity: 0; }
      12% { opacity: 1; }
      48%, 83% { stroke-dashoffset: 0; opacity: 1; }
      100% { stroke-dashoffset: 0; opacity: 0; }
    }
    @keyframes reveal-note { 0%, 15% { opacity: 0; } 45%, 83% { opacity: 1; } 100% { opacity: 0; } }
    @media (prefers-reduced-motion: reduce) {
      path:not([stroke-dasharray]), circle:not([fill]), text { animation: none; stroke-dashoffset: 0; }
    }
  </style>
  <!-- Original decorative geometry studies, drawn as a working notebook. -->
