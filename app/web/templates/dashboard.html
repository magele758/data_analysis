<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>数据分析</title>
  <link rel="stylesheet" href="/static/dashboard.css">
</head>
<body>
  <section id="cover" class="cover">
    <p class="cover-kicker">单机 · 本体 · 证据</p>
    <h1>数据分析</h1>
    <hr class="cover-rule">
    <p class="cover-sentence">把表、关系和证据放在同一处。</p>
    <button type="button" id="enter" class="btn">进入工作台</button>
  </section>
  <div id="app" class="app" hidden>
    <aside class="sidebar">
      <div class="brand">数据分析</div>
      <nav class="nav" aria-label="功能">
        <section class="nav-group" data-group="ingest">
          <div class="group-label">数据</div>
          <button type="button" class="nav-item" data-section="ingest" data-view="import-file">导入文件</button>
          <button type="button" class="nav-item" data-section="ingest" data-view="connect-db">连接数据库</button>
          <button type="button" class="nav-item" data-section="ingest" data-view="import-trace">导入 Trace</button>
        </section>
        <section class="nav-group" data-group="transform">
          <div class="group-label">准备</div>
          <button type="button" class="nav-item" data-section="transform" data-view="clean">清洗</button>
          <button type="button" class="nav-item" data-section="transform" data-view="pipeline">管道</button>
          <button type="button" class="nav-item" data-section="transform" data-view="wide">宽表</button>
        </section>
        <section class="nav-group" data-group="model">
          <div class="group-label">模型</div>
          <button type="button" class="nav-item" data-section="model" data-view="objects">对象与关系</button>
          <button type="button" class="nav-item" data-section="model" data-view="traverse">遍历与实体图</button>
          <button type="button" class="nav-item" data-section="model" data-view="metrics">指标与血缘</button>
        </section>
        <section class="nav-group" data-group="analyze">
          <div class="group-label">分析</div>
          <button type="button" class="nav-item" data-section="analyze" data-view="eda">EDA</button>
          <button type="button" class="nav-item" data-section="analyze" data-view="olap">OLAP</button>
          <button type="button" class="nav-item" data-section="analyze" data-view="driver">归因</button>
          <button type="button" class="nav-item" data-section="analyze" data-view="hypothesis">检验与回归</button>
          <button type="button" class="nav-item" data-section="analyze" data-view="variance">方差分解</button>
          <button type="button" class="nav-item" data-section="analyze" data-view="signals">异常趋势支配</button>
          <button type="button" class="nav-item" data-section="analyze" data-view="paths">漏斗留存路径</button>
          <button type="button" class="nav-item" data-section="analyze" data-view="forecast">预测</button>
        </section>
        <section class="nav-group" data-group="quality">
          <div class="group-label">质量</div>
          <button type="button" class="nav-item" data-section="govern" data-view="assert">断言</button>
          <button type="button" class="nav-item" data-section="govern" data-view="drift">结构漂移</button>
        </section>
        <section class="nav-group" data-group="activate">
          <div class="group-label">激活</div>
          <button type="button" class="nav-item" data-section="govern" data-view="sync">写回</button>
          <button type="button" class="nav-item" data-section="govern" data-view="audience">受众</button>
          <button type="button" class="nav-item" data-section="govern" data-view="alert">告警</button>
        </section>
        <section class="nav-group examples" data-group="examples">
          <div class="group-label">示例</div>
          <button type="button" class="nav-item" data-example="erp">ERP 一键跑通</button>
          <button type="button" class="nav-item" data-example="dota2">Dota 2 一键跑通</button>
        </section>
      </nav>
    </aside>
    <div class="workspace">
      <header class="topbar">
        <div id="crumb" class="crumb">数据 / 导入文件</div>
        <label class="session-field" for="session-id">会话
          <input id="session-id" name="session_id" type="text" spellcheck="false" autocomplete="off">
        </label>
      </header>
      <div id="notify" class="notify" hidden></div>
      <main class="content">
        <div id="mount"></div>
      </main>
    </div>
  </div>
  <script src="/static/sections/ingest.js"></script>
  <script src="/static/sections/transform.js"></script>
  <script src="/static/sections/model.js"></script>
  <script src="/static/sections/analyze.js"></script>
  <script src="/static/sections/govern.js"></script>
  <script src="/static/dashboard.js"></script>
</body>
</html>
