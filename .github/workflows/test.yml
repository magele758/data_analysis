name: Test Suite

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.13'
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e .

    - name: Run tests
      run: |
        pytest tests/ -v --tb=short --cov=app --cov-report=term-missing
      env:
        DATA_AGENT_API_KEYS: test-key-12345
        DATA_AGENT_REQUIRE_AUTH: "true"
        DATA_AGENT_LOG_LEVEL: INFO
        DATA_AGENT_CORS_ALLOW_ORIGINS: http://localhost:8000

    - name: Check test coverage
      run: |
        pytest tests/ --cov=app --cov-report=xml --cov-fail-under=80
      env:
        DATA_AGENT_API_KEYS: test-key-12345
        DATA_AGENT_REQUIRE_AUTH: "true"
