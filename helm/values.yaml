replicaCount: 3

image:
  # Published by the tag-driven release workflow to GHCR.
  # e.g. ghcr.io/magele758/data_analysis:1.2.3
  repository: ghcr.io/magele758/data_analysis
  tag: latest
  pullPolicy: IfNotPresent

# Optional. The service runs one DuckDB per session. Enable this chart only when
# workers share the spill directory used by DATA_AGENT_RAY_ADDRESS. The app flag
# DATA_AGENT_RAY_ENABLED defaults to false.
rayCluster:
  enabled: false
  head:
    resources:
      limits:
        cpu: "4"
        memory: "16Gi"
      requests:
        cpu: "2"
        memory: "8Gi"
  worker:
    replicas: 4
    minReplicas: 2
    maxReplicas: 32
    resources:
      limits:
        cpu: "8"
        memory: "32Gi"
      requests:
        cpu: "4"
        memory: "16Gi"

service:
  type: ClusterIP
  port: 8000
  mcpPort: 8001

ingress:
  enabled: true
  className: "nginx"
  annotations:
    nginx.ingress.kubernetes.io/affinity: "cookie"
    nginx.ingress.kubernetes.io/session-cookie-name: "DATA_SESSION_ID"
